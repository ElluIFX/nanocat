x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ./data:/app/data

services:
  nanocat-gateway:
    container_name: nanocat-gateway
    <<: *common-config
    command: ["gateway", "-w", "/app/data"]
    restart: unless-stopped
    ports:
      - 18790:18790
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  nanocat-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["tui", "-w", "/app/data"]
    stdin_open: true
    tty: true
